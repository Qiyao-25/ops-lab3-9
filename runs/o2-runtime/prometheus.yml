global:
  scrape_interval: 5s
  evaluation_interval: 5s
scrape_configs:
  - job_name: instances
    scrape_interval: 5s
    file_sd_configs:
      - files: ["state/targets.json"]
        refresh_interval: 5s
  - job_name: lbd
    scrape_interval: 1s
    static_configs:
      - targets: ["127.0.0.1:8090"]
  - job_name: node
    static_configs:
      - targets: ["127.0.0.1:9100"]
