# O5：用 HAProxy 替换 lbd。主动健康检查对齐 lbd 的默认参数：
# 每 1 秒 GET /readyz，超时 2s 内的连接超时，连续失败 3 次摘除，连续成功 2 次恢复。
# 前台运行：haproxy -f deploy/haproxy.cfg -db
global
    log stdout format raw local0
    maxconn 2000

defaults
    log global
    mode http
    option httplog
    timeout connect 2s
    timeout client 2s
    timeout server 2s

frontend fe
    bind 127.0.0.1:8080
    default_backend be

backend be
    option httpchk GET /readyz
    http-check expect status 200
    default-server inter 1s fall 3 rise 2
    server s8101 127.0.0.1:8101 check
    server s8102 127.0.0.1:8102 check
    server s8103 127.0.0.1:8103 check
